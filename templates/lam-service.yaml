{{- if .Values.lam.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openldap-iam.lamName" . }}
  labels:
    {{- include "openldap-iam.labels" . | nindent 4 }}
    app.kubernetes.io/name: ldap-account-manager
  {{- with .Values.lam.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.lam.service.type }}
  selector:
    {{- include "openldap-iam.lamSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.lam.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
